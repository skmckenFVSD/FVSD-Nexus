<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="470" viewBox="0 0 1120 470" role="img" aria-labelledby="title desc">
  <title id="title">FVSD Nexus responsive viewport bands</title>
  <desc id="desc">Five conceptual viewport frames show compact, small, medium, large and wide application layouts.</desc>
  <rect width="1120" height="470" rx="14" fill="#f5f7fa"/>
  <g font-family="Segoe UI, Arial, sans-serif">
    <text x="30" y="42" fill="#071940" font-size="24" font-weight="700">Responsive contract</text>
    <text x="30" y="66" fill="#4a5b6e" font-size="13">Viewport bands coordinate the shell; container queries adapt the remaining workspace.</text>

    <g transform="translate(30 96)">
      <rect width="160" height="260" rx="12" fill="#fff" stroke="#cfd8e3"/>
      <rect width="160" height="30" rx="12" fill="#071940"/>
      <rect y="18" width="160" height="12" fill="#071940"/>
      <rect x="12" y="44" width="136" height="34" rx="7" fill="#e8f0fe"/>
      <rect x="12" y="90" width="136" height="54" rx="8" fill="#fff" stroke="#dde3ea"/>
      <rect x="12" y="154" width="136" height="54" rx="8" fill="#fff" stroke="#dde3ea"/>
      <rect x="12" y="218" width="136" height="30" rx="7" fill="#2d6be7"/>
      <text x="80" y="286" fill="#071940" font-size="14" font-weight="700" text-anchor="middle">Compact</text>
      <text x="80" y="305" fill="#5a6b7d" font-size="12" text-anchor="middle">0–599</text>
      <text x="80" y="329" fill="#4a5b6e" font-size="11" text-anchor="middle">cards · stacked actions</text>
    </g>

    <g transform="translate(210 96)">
      <rect width="190" height="260" rx="12" fill="#fff" stroke="#cfd8e3"/>
      <rect width="38" height="260" rx="12" fill="#071940"/>
      <rect x="50" y="16" width="124" height="24" rx="6" fill="#e8f0fe"/>
      <rect x="50" y="54" width="124" height="70" rx="8" fill="#fff" stroke="#dde3ea"/>
      <rect x="50" y="136" width="124" height="70" rx="8" fill="#fff" stroke="#dde3ea"/>
      <rect x="50" y="218" width="124" height="28" rx="7" fill="#2d6be7"/>
      <text x="95" y="286" fill="#071940" font-size="14" font-weight="700" text-anchor="middle">Small</text>
      <text x="95" y="305" fill="#5a6b7d" font-size="12" text-anchor="middle">600–899</text>
      <text x="95" y="329" fill="#4a5b6e" font-size="11" text-anchor="middle">rail · overlay drawer</text>
    </g>

    <g transform="translate(420 96)">
      <rect width="210" height="260" rx="12" fill="#fff" stroke="#cfd8e3"/>
      <rect width="40" height="260" rx="12" fill="#071940"/>
      <rect x="52" y="16" width="142" height="24" rx="6" fill="#e8f0fe"/>
      <rect x="52" y="54" width="44" height="192" rx="8" fill="#f5f7fa" stroke="#dde3ea"/>
      <rect x="106" y="54" width="88" height="192" rx="8" fill="#fff" stroke="#dde3ea"/>
      <text x="105" y="286" fill="#071940" font-size="14" font-weight="700" text-anchor="middle">Medium</text>
      <text x="105" y="305" fill="#5a6b7d" font-size="12" text-anchor="middle">900–1199</text>
      <text x="105" y="329" fill="#4a5b6e" font-size="11" text-anchor="middle">conditional section list</text>
    </g>

    <g transform="translate(650 96)">
      <rect width="210" height="260" rx="12" fill="#fff" stroke="#cfd8e3"/>
      <rect width="40" height="260" rx="12" fill="#071940"/>
      <rect x="52" y="16" width="142" height="24" rx="6" fill="#e8f0fe"/>
      <rect x="52" y="54" width="48" height="192" rx="8" fill="#f5f7fa" stroke="#dde3ea"/>
      <rect x="110" y="54" width="84" height="192" rx="8" fill="#fff" stroke="#dde3ea"/>
      <text x="105" y="286" fill="#071940" font-size="14" font-weight="700" text-anchor="middle">Large</text>
      <text x="105" y="305" fill="#5a6b7d" font-size="12" text-anchor="middle">1200–1399</text>
      <text x="105" y="329" fill="#4a5b6e" font-size="11" text-anchor="middle">full workspace pattern</text>
    </g>

    <g transform="translate(880 96)">
      <rect width="210" height="260" rx="12" fill="#fff" stroke="#cfd8e3"/>
      <rect width="38" height="260" rx="12" fill="#071940"/>
      <rect x="50" y="16" width="144" height="24" rx="6" fill="#e8f0fe"/>
      <rect x="50" y="54" width="42" height="192" rx="8" fill="#f5f7fa" stroke="#dde3ea"/>
      <rect x="102" y="54" width="92" height="192" rx="8" fill="#fff" stroke="#dde3ea"/>
      <text x="105" y="286" fill="#071940" font-size="14" font-weight="700" text-anchor="middle">Wide</text>
      <text x="105" y="305" fill="#5a6b7d" font-size="12" text-anchor="middle">1400+</text>
      <text x="105" y="329" fill="#4a5b6e" font-size="11" text-anchor="middle">maximum working width</text>
    </g>

    <rect x="30" y="428" width="1060" height="1" fill="#dde3ea"/>
    <text x="560" y="452" fill="#4a5b6e" font-size="12" text-anchor="middle">Open drawers and split panels trigger container changes independently of the viewport band.</text>
  </g>
</svg>
