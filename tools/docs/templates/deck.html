<!DOCTYPE html>
<html lang="en-CA" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
{{HEAD}}
<style>
{{TOKENS}}

:root{
  --navy:#071940;
  --navy-deep:#04102b;
  --teal:#1F4E79;
  --cyan:#4A90E2;
  --cyan-bright:#6FB1F5;
  --mint:#B8E986;
  --amber:#F5A623;
  --red:#D0021B;
  --ink:#F4F7FC;
  --ink-soft:#B9C6DC;
  --ink-faint:#7B92AA;
  --rule:rgba(122,150,190,.22);
  --panel:rgba(255,255,255,.045);
  --panel-2:rgba(255,255,255,.075);
  --sidebar-w:288px;
  --font:"Segoe UI",-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
  --ease:cubic-bezier(.22,.61,.36,1);
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0;padding:0}
body{
  background:var(--navy-deep);
  color:var(--ink);
  font-family:var(--font);
  overflow:hidden;
  -webkit-font-smoothing:antialiased;
}

/* ---------------------------------------------------------------- sidebar */
#sidebar{
  position:fixed;inset-block:0;inset-inline-start:0;
  inline-size:var(--sidebar-w);
  background:linear-gradient(180deg,#061634 0%,#04102b 100%);
  border-inline-end:1px solid var(--rule);
  display:flex;flex-direction:column;
  z-index:60;
  transition:transform .42s var(--ease);
}
body.nav-hidden #sidebar{transform:translateX(calc(-1 * var(--sidebar-w)))}
.sb-head{
  padding:26px 22px 18px;
  border-block-end:1px solid var(--rule);
}
.sb-mark{display:flex;align-items:center;gap:11px}
.sb-logo{
  inline-size:34px;block-size:34px;border-radius:9px;flex:none;
  display:block;object-fit:contain;
  box-shadow:0 0 0 1px rgba(255,255,255,.14),0 6px 18px rgba(74,144,226,.3);
}
.sb-name{font-size:16px;font-weight:700;letter-spacing:.2px}
.sb-sub{font-size:10.5px;color:var(--ink-faint);letter-spacing:1.3px;text-transform:uppercase;margin-block-start:2px}
.sb-scroll{flex:1;overflow-y:auto;padding:12px 0 18px;scrollbar-width:thin}
.sb-scroll::-webkit-scrollbar{inline-size:6px}
.sb-scroll::-webkit-scrollbar-thumb{background:var(--rule);border-radius:3px}
.sb-group{
  padding:16px 22px 7px;font-size:9.5px;letter-spacing:1.5px;
  text-transform:uppercase;color:var(--ink-faint);font-weight:700;
}
.sb-item{
  display:flex;align-items:center;gap:11px;
  padding:8px 22px;inline-size:100%;
  background:none;border:0;cursor:pointer;
  color:var(--ink-soft);font-family:inherit;font-size:13px;text-align:start;
  border-inline-start:2px solid transparent;
  transition:color .18s,background .18s,border-color .18s;
}
.sb-item:hover{color:var(--ink);background:var(--panel)}
.sb-item:focus-visible{outline:2px solid var(--cyan);outline-offset:-2px}
.sb-item[aria-current="true"]{
  color:#fff;background:linear-gradient(90deg,rgba(74,144,226,.19),transparent);
  border-inline-start-color:var(--cyan);font-weight:600;
}
.sb-num{
  font-size:10px;color:var(--ink-faint);min-inline-size:17px;
  font-variant-numeric:tabular-nums;flex:none;
}
.sb-item[aria-current="true"] .sb-num{color:var(--cyan-bright)}
.sb-foot{
  padding:13px 22px;border-block-start:1px solid var(--rule);
  font-size:10.5px;color:var(--ink-faint);line-height:1.65;
}
.sb-foot kbd{
  background:var(--panel-2);border:1px solid var(--rule);border-radius:4px;
  padding:1px 5px;font-family:inherit;font-size:9.5px;color:var(--ink-soft);
}

/* ------------------------------------------------------------------ stage */
#stage{
  position:fixed;inset-block:0;
  inset-inline-start:var(--sidebar-w);inset-inline-end:0;
  transition:inset-inline-start .42s var(--ease);
}
body.nav-hidden #stage{inset-inline-start:0}

.slide{
  position:absolute;inset:0;
  display:flex;flex-direction:column;justify-content:center;
  justify-content:safe center;
  padding:clamp(38px,5.2vw,86px) clamp(38px,6vw,104px);
  opacity:0;visibility:hidden;
  transform:translateX(60px);
  transition:opacity .5s var(--ease),transform .5s var(--ease),visibility 0s .5s;
  overflow:auto;
}
.slide.is-current{
  opacity:1;visibility:visible;transform:none;
  transition:opacity .5s var(--ease),transform .5s var(--ease),visibility 0s 0s;
}
.slide.is-past{transform:translateX(-60px)}

/* stagger children of the live slide */
.slide.is-current > *{animation:rise .52s var(--ease) both}
.slide.is-current > *:nth-child(1){animation-delay:.05s}
.slide.is-current > *:nth-child(2){animation-delay:.11s}
.slide.is-current > *:nth-child(3){animation-delay:.17s}
.slide.is-current > *:nth-child(4){animation-delay:.23s}
.slide.is-current > *:nth-child(5){animation-delay:.29s}
.slide.is-current > *:nth-child(6){animation-delay:.35s}
@keyframes rise{from{opacity:0;transform:translateY(15px)}to{opacity:1;transform:none}}

/* ---------------------------------------------------------------- typography */
.eyebrow{
  font-size:11px;letter-spacing:2.6px;text-transform:uppercase;
  color:var(--cyan-bright);font-weight:700;margin:0 0 18px;
  display:flex;align-items:center;gap:11px;
}
.eyebrow::after{content:"";block-size:1px;flex:1;background:linear-gradient(90deg,var(--rule),transparent);max-inline-size:200px}
h1{font-size:clamp(38px,5.4vw,74px);line-height:1.03;margin:0 0 22px;font-weight:800;letter-spacing:-1.4px}
h2{font-size:clamp(28px,3.5vw,47px);line-height:1.12;margin:0 0 22px;font-weight:750;letter-spacing:-.9px}
h3{font-size:clamp(17px,1.75vw,22px);margin:0 0 9px;font-weight:700;letter-spacing:-.2px}
p{font-size:clamp(15px,1.42vw,19.5px);line-height:1.62;color:var(--ink-soft);margin:0 0 15px;max-inline-size:60ch}
.lead{font-size:clamp(17px,1.75vw,24px);color:var(--ink);line-height:1.5;max-inline-size:52ch}
strong{color:#fff;font-weight:650}
.accent{color:var(--cyan-bright)}
.mint{color:var(--mint)}
.amber{color:var(--amber)}

/* ------------------------------------------------------------------ title */
.slide.title{align-items:flex-start;background:radial-gradient(1100px 620px at 78% 12%,rgba(31,78,121,.42),transparent 62%)}
.title h1{max-inline-size:16ch}
.title .rule{inline-size:82px;block-size:4px;border-radius:2px;background:linear-gradient(90deg,var(--cyan),var(--mint));margin:0 0 26px}
.byline{margin-block-start:34px;padding-block-start:22px;border-block-start:1px solid var(--rule);font-size:14.5px;color:var(--ink-soft)}
.byline b{color:#fff;display:block;font-size:16.5px;margin-block-end:3px;font-weight:650}

/* ------------------------------------------------------------------ layout */
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(238px,1fr));gap:clamp(14px,1.5vw,24px);margin-block-start:8px}
.cols.two{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.card{
  background:var(--panel);border:1px solid var(--rule);border-radius:14px;
  padding:clamp(17px,1.7vw,25px);
  transition:transform .28s var(--ease),border-color .28s,background .28s;
}
.card:hover{transform:translateY(-3px);border-color:rgba(74,144,226,.5);background:var(--panel-2)}
.card p{font-size:14.5px;margin:0;line-height:1.58}
.card .k{
  font-size:10px;letter-spacing:1.7px;text-transform:uppercase;
  color:var(--cyan-bright);font-weight:700;margin-block-end:9px;
}
.card.mint-edge{border-block-start:3px solid var(--mint)}
.card.cyan-edge{border-block-start:3px solid var(--cyan)}
.card.amber-edge{border-block-start:3px solid var(--amber)}

/* truth cards */
.truth{display:grid;grid-template-columns:repeat(auto-fit,minmax(258px,1fr));gap:18px;margin-block-start:10px}
.truth .card{position:relative;padding-block-start:26px}
.truth .q{font-size:13px;color:var(--ink-faint);margin-block-end:11px;line-height:1.45;min-block-size:2.9em}
.truth .a{font-size:clamp(18px,1.9vw,25px);font-weight:750;color:#fff;line-height:1.2;margin-block-end:11px;letter-spacing:-.4px}
.truth .d{font-size:13px;color:var(--ink-soft);line-height:1.55;margin:0}
.badge{
  position:absolute;inset-block-start:-11px;inset-inline-start:22px;
  font-size:9.5px;letter-spacing:1.5px;text-transform:uppercase;font-weight:750;
  padding:4px 11px;border-radius:99px;color:#04102b;
}
.b-record{background:var(--cyan)}
.b-calc{background:var(--mint)}
.b-id{background:var(--amber)}

/* catalogue strip: deliberately NOT a fourth truth card */
.catalog{
  margin-block-start:20px;
  display:flex;align-items:flex-start;gap:16px;
  padding:17px 22px;border-radius:13px;
  background:linear-gradient(90deg,rgba(122,150,190,.12),rgba(122,150,190,.03));
  border:1px dashed rgba(122,150,190,.4);
}
.catalog .ctag{
  flex:none;font-size:9.5px;letter-spacing:1.5px;text-transform:uppercase;
  font-weight:750;color:var(--ink-faint);border:1px solid var(--rule);
  padding:5px 11px;border-radius:99px;margin-block-start:2px;white-space:nowrap;
}
.catalog p{margin:0;font-size:14.5px;line-height:1.55;max-inline-size:none}
.catalog b{color:#fff;font-weight:650}

/* lists */
ul.clean{list-style:none;padding:0;margin:6px 0 0}
ul.clean li{
  position:relative;padding-inline-start:29px;margin-block-end:15px;
  font-size:clamp(14.5px,1.35vw,18px);line-height:1.58;color:var(--ink-soft);
  max-inline-size:62ch;
}
ul.clean li::before{
  content:"";position:absolute;inset-inline-start:2px;inset-block-start:.62em;
  inline-size:8px;block-size:8px;border-radius:2px;
  background:linear-gradient(135deg,var(--cyan),var(--teal));
}
ul.clean.mint li::before{background:linear-gradient(135deg,var(--mint),#7cc94a)}

/* stat row */
.stats{display:flex;flex-wrap:wrap;gap:clamp(20px,3.4vw,58px);margin-block-start:16px}
.stat .v{font-size:clamp(34px,4.4vw,60px);font-weight:800;line-height:1;letter-spacing:-1.8px;
  background:linear-gradient(135deg,#fff,var(--cyan-bright));-webkit-background-clip:text;background-clip:text;color:transparent}
.stat .l{font-size:12.5px;color:var(--ink-faint);margin-block-start:9px;max-inline-size:19ch;line-height:1.45}

/* quote */
.pull{
  border-inline-start:4px solid var(--cyan);padding:6px 0 6px 26px;margin:6px 0 0;
  font-size:clamp(20px,2.5vw,33px);line-height:1.34;color:#fff;font-weight:600;
  letter-spacing:-.5px;max-inline-size:22ch;
}
.slide.statement{background:radial-gradient(880px 520px at 50% 50%,rgba(31,78,121,.34),transparent 66%);align-items:center;text-align:center}
.slide.statement .pull{border:0;padding:0;text-align:center;max-inline-size:20ch;font-size:clamp(26px,4vw,54px);font-weight:750;line-height:1.18}
.slide.statement .attrib{margin-block-start:26px;font-size:13px;letter-spacing:2.2px;text-transform:uppercase;color:var(--ink-faint)}

/* flow */
.flow{display:flex;flex-wrap:wrap;align-items:stretch;gap:11px;margin-block-start:14px}
.flow .step{
  flex:1 1 158px;background:var(--panel);border:1px solid var(--rule);
  border-radius:12px;padding:16px 17px;position:relative;
}
.flow .step .n{font-size:10px;color:var(--cyan-bright);font-weight:750;letter-spacing:1.4px;margin-block-end:7px}
.flow .step h3{font-size:15px;margin-block-end:5px}
.flow .step p{font-size:12.5px;margin:0;line-height:1.5}

/* timeline */
.tl{margin-block-start:12px;border-inline-start:2px solid var(--rule);padding-inline-start:26px}
.tl .ev{position:relative;padding-block-end:20px}
.tl .ev:last-child{padding-block-end:0}
.tl .ev::before{
  content:"";position:absolute;inset-inline-start:-33px;inset-block-start:5px;
  inline-size:11px;block-size:11px;border-radius:50%;
  background:var(--navy-deep);border:2px solid var(--cyan);
}
.tl .ev.done::before{background:var(--mint);border-color:var(--mint)}
.tl .when{font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--cyan-bright);font-weight:700}
.tl .what{font-size:15.5px;color:var(--ink);margin-block-start:4px;line-height:1.5;max-inline-size:58ch}

/* status pills */
.pill{
  display:inline-block;font-size:10px;letter-spacing:1.3px;text-transform:uppercase;
  font-weight:750;padding:3px 10px;border-radius:99px;margin-inline-end:7px;
}
.p-live{background:rgba(184,233,134,.17);color:var(--mint);border:1px solid rgba(184,233,134,.42)}
.p-next{background:rgba(74,144,226,.17);color:var(--cyan-bright);border:1px solid rgba(74,144,226,.42)}
.p-prop{background:rgba(245,166,35,.15);color:var(--amber);border:1px solid rgba(245,166,35,.4)}

/* capability table */
.captable{margin-block-start:10px;inline-size:100%;border-collapse:collapse;font-size:14px}
.captable th{
  text-align:start;padding:9px 14px;font-size:10px;letter-spacing:1.5px;
  text-transform:uppercase;color:var(--ink-faint);border-block-end:1px solid var(--rule);font-weight:700;
}
.captable td{padding:11px 14px;border-block-end:1px solid rgba(122,150,190,.11);color:var(--ink-soft);line-height:1.45}
.captable td:first-child{color:#fff;font-weight:600}
.captable tr:last-child td{border-block-end:0}

/* ------------------------------------------------------------------ chrome */
#bar{
  position:fixed;inset-block-end:0;inset-inline:0;block-size:3px;
  background:rgba(255,255,255,.07);z-index:70;
}
#bar span{
  display:block;block-size:100%;inline-size:0;
  background:linear-gradient(90deg,var(--teal),var(--cyan),var(--mint));
  transition:inline-size .45s var(--ease);
}
#hud{
  position:fixed;inset-block-end:20px;inset-inline-end:26px;
  display:flex;align-items:center;gap:8px;z-index:70;
}
.btn{
  inline-size:36px;block-size:36px;border-radius:9px;
  background:var(--panel);border:1px solid var(--rule);color:var(--ink-soft);
  cursor:pointer;font-size:15px;line-height:1;display:grid;place-items:center;
  transition:background .2s,color .2s,border-color .2s,transform .2s;
  font-family:inherit;padding:0;
}
.btn:hover{background:var(--panel-2);color:#fff;border-color:rgba(74,144,226,.55);transform:translateY(-2px)}
.btn:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
.btn:disabled{opacity:.3;cursor:default;transform:none}
#count{
  font-size:12px;color:var(--ink-faint);font-variant-numeric:tabular-nums;
  padding-inline:11px;min-inline-size:62px;text-align:center;letter-spacing:.5px;
}
#count b{color:#fff;font-weight:650}

/* ---------------------------------------------------------------- overview */
#grid{
  position:fixed;inset:0;z-index:90;background:rgba(4,16,43,.975);
  padding:38px;overflow-y:auto;display:none;
}
body.grid-on #grid{display:block}
#grid h2{font-size:20px;margin:0 0 20px;color:var(--ink-soft);font-weight:600;letter-spacing:0}
.gwrap{display:grid;grid-template-columns:repeat(auto-fill,minmax(216px,1fr));gap:15px}
.gcard{
  background:var(--panel);border:1px solid var(--rule);border-radius:11px;
  padding:15px;cursor:pointer;text-align:start;color:var(--ink-soft);
  font-family:inherit;transition:transform .22s var(--ease),border-color .22s,background .22s;
  min-block-size:96px;display:flex;flex-direction:column;gap:7px;
}
.gcard:hover{transform:translateY(-3px);border-color:var(--cyan);background:var(--panel-2)}
.gcard:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
.gcard .gn{font-size:10px;color:var(--cyan-bright);font-weight:750;letter-spacing:1.3px}
.gcard .gt{font-size:13.5px;color:#fff;line-height:1.38;font-weight:600}
.gcard[aria-current="true"]{border-color:var(--mint);background:rgba(184,233,134,.09)}

/* ------------------------------------------------------------------- print */
@page{size:letter landscape;margin:12mm}
@media print{
  body{overflow:visible;background:#fff;color:#111}
  #sidebar,#hud,#bar,#grid{display:none!important}
  #stage{position:static;inset:auto}
  .slide{
    position:relative;inset:auto;opacity:1!important;visibility:visible!important;
    transform:none!important;page-break-after:always;break-after:page;
    break-inside:avoid;min-block-size:auto;block-size:auto;padding:0 0 22px;
  }
  .slide:last-child{page-break-after:auto;break-after:auto}
  .slide.is-current > *{animation:none!important}
  h1,h2,h3,.truth .a,strong,b{color:#071940!important}
  p,li,.card p,.truth .d,.catalog p{color:#333!important}
  .lead{color:#111!important}
  /* gradient-clipped text has no background in print: restore a solid colour */
  .stat .v{
    background:none!important;color:#071940!important;
    -webkit-text-fill-color:#071940!important;
  }
  /* light-on-dark accents are illegible on paper: darken them */
  .eyebrow,.card .k,.tl .when,.flow .step .n,.accent,.sb-num{color:#00607a!important}
  .mint,.amber{color:#0B5D3B!important}
  .truth .q,.stat .l,.attrib{color:#555!important}
  .eyebrow::after{background:#ccc!important}
  .card,.gcard,.flow .step,.catalog{
    border-color:#bbb!important;background:none!important;
  }
  .card.mint-edge{border-block-start:3px solid #0B5D3B!important}
  .card.cyan-edge{border-block-start:3px solid #0097BC!important}
  .card.amber-edge{border-block-start:3px solid #B26A00!important}
  .pull{border-inline-start-color:#0097BC!important;color:#071940!important}
  .title .rule{background:#0097BC!important}
  .tl{border-inline-start-color:#bbb!important}
  .tl .ev::before{background:#fff!important;border-color:#0097BC!important}
  .captable th{color:#555!important;border-block-end-color:#bbb!important}
  .captable td{border-block-end-color:#e0e0e0!important}
  /* keep colour-coded chips meaningful on paper */
  .badge,.pill{
    -webkit-print-color-adjust:exact;print-color-adjust:exact;
    border:1px solid #999!important;
  }
  .badge{color:#071940!important;background:none!important}
  .p-live{color:#0B5D3B!important;background:none!important}
  .p-next{color:#00607a!important;background:none!important}
  .p-prop{color:#8a4b00!important;background:none!important}
  .slide.title,.slide.statement{background:none!important}
}
@media (prefers-reduced-motion:reduce){
  .slide,.slide.is-current > *,#bar span,#sidebar,#stage{transition-duration:.01ms!important;animation:none!important}
}
@media (max-width:900px){
  :root{--sidebar-w:0px}
  #sidebar{transform:translateX(-288px);inline-size:288px}
  body.nav-open #sidebar{transform:none}
  #stage{inset-inline-start:0}
}
/* generated decks: spacing for a paragraph that follows a component */
.slide > :is(.cols,.truth,.stats,.flow,.tl,ul.clean,.captable,.catalog) + p{margin-block-start:16px}
.title .rule + h1{margin-block-start:0}
</style>
</head>
<body>

<nav id="sidebar" aria-label="Presentation contents">
  <div class="sb-head">
    <div class="sb-mark">
      <img class="sb-logo" src="{{LOGO}}" alt="">
      <div>
        <div class="sb-name">{{BRAND_NAME}}</div>
        <div class="sb-sub">{{BRAND_SUB}}</div>
      </div>
    </div>
  </div>
  <div class="sb-scroll" id="sbList"></div>
  <div class="sb-foot">
    <kbd>←</kbd> <kbd>→</kbd> navigate &nbsp;·&nbsp; <kbd>Esc</kbd> overview<br>
    <kbd>F</kbd> fullscreen &nbsp;·&nbsp; <kbd>N</kbd> hide menu
  </div>
</nav>

<main id="stage">
{{SLIDES}}
</main>

<div id="hud">
  <button class="btn" id="btnMenu" type="button" title="Contents (N)" aria-label="Toggle contents menu">☰</button>
  <button class="btn" id="btnGrid" type="button" title="Overview (Esc)" aria-label="Toggle slide overview">▦</button>
  <button class="btn" id="btnPrev" type="button" title="Previous (←)" aria-label="Previous slide">‹</button>
  <span id="count" aria-live="polite"><b>1</b> / {{COUNT}}</span>
  <button class="btn" id="btnNext" type="button" title="Next (→)" aria-label="Next slide">›</button>
  <button class="btn" id="btnFull" type="button" title="Fullscreen (F)" aria-label="Toggle fullscreen">⛶</button>
</div>

<div id="bar" role="presentation"><span id="barFill"></span></div>

<div id="grid" aria-label="Slide overview" role="dialog" aria-modal="true">
  <h2>All slides: click to jump</h2>
  <div class="gwrap" id="gridWrap"></div>
</div>

<script>
(function(){
  "use strict";
  var slides = Array.prototype.slice.call(document.querySelectorAll(".slide"));
  var sbList = document.getElementById("sbList");
  var gridWrap = document.getElementById("gridWrap");
  var barFill = document.getElementById("barFill");
  var count = document.getElementById("count");
  var body = document.body;
  var idx = 0, total = slides.length;

  /* ---- build sidebar (grouped) + overview grid ---- */
  var lastGroup = null;
  slides.forEach(function(s, i){
    var title = s.getAttribute("data-title") || ("Slide " + (i+1));
    var group = s.getAttribute("data-group") || "";
    s.setAttribute("aria-hidden","true");
    s.id = "slide-" + (i+1);

    if (group && group !== lastGroup){
      var g = document.createElement("div");
      g.className = "sb-group";
      g.textContent = group;
      sbList.appendChild(g);
      lastGroup = group;
    }
    var b = document.createElement("button");
    b.type = "button";
    b.className = "sb-item";
    b.setAttribute("data-i", String(i));
    var n = document.createElement("span");
    n.className = "sb-num";
    n.textContent = (i+1 < 10 ? "0" : "") + (i+1);
    var t = document.createElement("span");
    t.textContent = title;
    b.appendChild(n); b.appendChild(t);
    sbList.appendChild(b);

    var g2 = document.createElement("button");
    g2.type = "button";
    g2.className = "gcard";
    g2.setAttribute("data-i", String(i));
    var gn = document.createElement("div");
    gn.className = "gn";
    gn.textContent = "SLIDE " + (i+1);
    var gt = document.createElement("div");
    gt.className = "gt";
    gt.textContent = title;
    g2.appendChild(gn); g2.appendChild(gt);
    gridWrap.appendChild(g2);
  });

  var navBtns = Array.prototype.slice.call(sbList.querySelectorAll(".sb-item"));
  var gridBtns = Array.prototype.slice.call(gridWrap.querySelectorAll(".gcard"));

  function render(){
    slides.forEach(function(s,i){
      s.classList.toggle("is-current", i === idx);
      s.classList.toggle("is-past", i < idx);
      s.setAttribute("aria-hidden", i === idx ? "false" : "true");
    });
    navBtns.forEach(function(b,i){ b.setAttribute("aria-current", i === idx ? "true" : "false"); });
    gridBtns.forEach(function(b,i){ b.setAttribute("aria-current", i === idx ? "true" : "false"); });
    barFill.style.inlineSize = (total < 2 ? 100 : (idx/(total-1))*100) + "%";
    count.innerHTML = "<b>" + (idx+1) + "</b> / " + total;
    document.getElementById("btnPrev").disabled = (idx === 0);
    document.getElementById("btnNext").disabled = (idx === total-1);
    var active = navBtns[idx];
    if (active && active.scrollIntoView) active.scrollIntoView({block:"nearest"});
    if (location.hash !== "#" + (idx+1)) {
      try { history.replaceState(null,"","#"+(idx+1)); } catch(e){}
    }
  }

  function go(n, reverse){
    n = Math.max(0, Math.min(total-1, n));
    if (n === idx) return;
    idx = n;
    render();
  }
  function next(){ if (idx < total-1) go(idx+1, false); }
  function prev(){ if (idx > 0) go(idx-1, true); }

  /* ---- events ---- */
  navBtns.forEach(function(b){
    b.addEventListener("click", function(){
      go(parseInt(b.getAttribute("data-i"),10));
      if (window.innerWidth <= 900) body.classList.remove("nav-open");
    });
  });
  gridBtns.forEach(function(b){
    b.addEventListener("click", function(){
      go(parseInt(b.getAttribute("data-i"),10));
      body.classList.remove("grid-on");
    });
  });
  function toggleNav(){
    if (window.innerWidth <= 900) body.classList.toggle("nav-open");
    else body.classList.toggle("nav-hidden");
  }
  document.getElementById("btnMenu").addEventListener("click", toggleNav);
  document.getElementById("btnNext").addEventListener("click", next);
  document.getElementById("btnPrev").addEventListener("click", prev);
  document.getElementById("btnGrid").addEventListener("click", function(){
    body.classList.toggle("grid-on");
  });
  document.getElementById("btnFull").addEventListener("click", function(){
    if (!document.fullscreenElement){
      if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen();
    } else if (document.exitFullscreen) {
      document.exitFullscreen();
    }
  });

  document.addEventListener("keydown", function(e){
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    var k = e.key;
    if (k === "ArrowRight" || k === "PageDown" || k === " " || k === "Spacebar"){ e.preventDefault(); next(); }
    else if (k === "ArrowLeft" || k === "PageUp"){ e.preventDefault(); prev(); }
    else if (k === "ArrowDown"){ e.preventDefault(); next(); }
    else if (k === "ArrowUp"){ e.preventDefault(); prev(); }
    else if (k === "Home"){ e.preventDefault(); go(0, true); }
    else if (k === "End"){ e.preventDefault(); go(total-1, false); }
    else if (k === "Escape"){ e.preventDefault(); body.classList.toggle("grid-on"); }
    else if (k === "f" || k === "F"){ document.getElementById("btnFull").click(); }
    else if (k === "n" || k === "N"){ toggleNav(); }
  });

  /* ---- touch ---- */
  var x0 = null, y0 = null;
  document.addEventListener("touchstart", function(e){
    if (e.touches.length !== 1) return;
    x0 = e.touches[0].clientX; y0 = e.touches[0].clientY;
  }, {passive:true});
  document.addEventListener("touchend", function(e){
    if (x0 === null) return;
    var t = e.changedTouches[0];
    var dx = t.clientX - x0, dy = t.clientY - y0;
    if (Math.abs(dx) > 55 && Math.abs(dx) > Math.abs(dy)*1.6){ dx < 0 ? next() : prev(); }
    x0 = null; y0 = null;
  }, {passive:true});

  /* ---- deep link ---- */
  var h = parseInt((location.hash || "").replace("#",""), 10);
  if (!isNaN(h) && h >= 1 && h <= total) idx = h - 1;

  render();
})();
</script>
</body>
</html>
